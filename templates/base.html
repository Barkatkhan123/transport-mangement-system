<!DOCTYPE html>
<html lang="en" class="h-full scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}TMS — Transport Management System{% endblock %}</title>

  <!-- Font Awesome 6 Free -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Google Fonts: Poppins (display) + Inter (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: { 50:'#eff6ff', 100:'#dbeafe', 500:'#3B82F6', 600:'#2563EB', 700:'#1D4ED8', 800:'#1e40af', 900:'#1e3a8a' },
            accent:  { 400:'#fb923c', 500:'#f97316', 600:'#ea580c' },
          },
          fontFamily: {
            sans:    ['Inter', 'sans-serif'],
            display: ['Poppins', 'sans-serif'],
          },
          boxShadow: {
            'card':       '0 1px 3px 0 rgb(0 0 0 / 0.08), 0 1px 2px -1px rgb(0 0 0 / 0.06)',
            'card-hover': '0 10px 25px -5px rgb(0 0 0 / 0.1), 0 4px 10px -6px rgb(0 0 0 / 0.08)',
            'glow':       '0 0 0 3px rgb(59 130 246 / 0.2)',
          }
        }
      }
    }
  </script>

  <!-- Dark-mode init: runs before paint to avoid flash -->
  <script>
    (function () {
      const saved = localStorage.getItem('tms-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>

  <style>
    /* ── CSS custom properties ───────────────────── */
    :root {
      --bg:      #f8fafc;
      --surface: #ffffff;
      --border:  #e2e8f0;
      --text:    #0f172a;
      --muted:   #64748b;
    }
    .dark {
      --bg:      #0f172a;
      --surface: #1e293b;
      --border:  #334155;
      --text:    #f1f5f9;
      --muted:   #94a3b8;
    }

    /* ── Base ────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }
    html { font-feature-settings: 'cv02','cv03','cv04','cv11'; }
    body {
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      background: var(--bg);
      color: var(--text);
      transition: background-color .3s, color .3s;
    }
    h1, h2, h3, h4 { font-family: 'Poppins', sans-serif; }

    /* ── Focus ───────────────────────────────────── */
    :focus-visible { outline: 2px solid #3B82F6; outline-offset: 2px; border-radius: 6px; }

    /* ── Scrollbar ───────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

    /* ── Animations ──────────────────────────────── */
    .fade-up   { animation: fadeUp .35s cubic-bezier(.16,1,.3,1) both; }
    .fade-up-2 { animation: fadeUp .35s .07s cubic-bezier(.16,1,.3,1) both; }
    .fade-up-3 { animation: fadeUp .35s .14s cubic-bezier(.16,1,.3,1) both; }
    .fade-up-4 { animation: fadeUp .35s .21s cubic-bezier(.16,1,.3,1) both; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(16px);} to{opacity:1;transform:translateY(0);} }

    .slide-in { animation: slideIn .3s cubic-bezier(.16,1,.3,1) both; }
    @keyframes slideIn { from{opacity:0;transform:translateX(24px);} to{opacity:1;transform:translateX(0);} }

    /* ── Hero Slider ─────────────────────────────── */
    .hero-slider { position: relative; overflow: hidden; }
    .slider-track { display: flex; will-change: transform; transition: transform .75s cubic-bezier(.77,0,.175,1); }
    .slider-slide { min-width: 100%; flex-shrink: 0; position: relative; }

    .slider-dot {
      width: 8px; height: 8px; border-radius: 9999px;
      background: rgba(255,255,255,.35); border: none; cursor: pointer;
      transition: width .35s, background .35s; padding: 0;
    }
    .slider-dot.active { width: 28px; background: #fff; }

    .slider-arrow {
      position: absolute; top: 50%; transform: translateY(-50%); z-index: 20;
      width: 2.75rem; height: 2.75rem; border-radius: 9999px;
      background: rgba(255,255,255,.12); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,.22); color: #fff;
      display: none; align-items: center; justify-content: center;
      cursor: pointer; transition: background .2s; font-size: .95rem;
    }
    @media (min-width: 640px) { .slider-arrow { display: flex; } }
    .slider-arrow:hover { background: rgba(255,255,255,.25); }
    .slider-arrow.prev { left: 1.25rem; }
    .slider-arrow.next { right: 1.25rem; }

    /* ── Seat map ────────────────────────────────── */
    .seat { transition: transform .15s ease, box-shadow .15s ease; cursor: pointer; }
    .seat:hover:not(.booked) { transform: scale(1.15); box-shadow: 0 4px 14px -2px rgba(29,78,216,.35); }
    .seat.selected { background: #1D4ED8 !important; color: #fff !important; border-color: #1D4ED8 !important; }
    .seat.booked   { cursor: not-allowed; }

    /* ── Form input ──────────────────────────────── */
    .form-input {
      width: 100%; padding: .75rem 1rem; border-radius: .625rem;
      border: 1.5px solid var(--border); background: var(--bg);
      font-size: .875rem; color: var(--text); transition: border-color .15s, box-shadow .15s;
    }
    .form-input:focus { outline: none; border-color: #3B82F6; box-shadow: 0 0 0 3px rgba(59,130,246,.15); background: var(--surface); }

    /* ── Badges ──────────────────────────────────── */
    .badge { display:inline-flex; align-items:center; font-size:.7rem; font-weight:600; padding:.25rem .625rem; border-radius:9999px; letter-spacing:.01em; }
    .badge-green  { background:#dcfce7; color:#15803d; }
    .badge-yellow { background:#fef9c3; color:#a16207; }
    .badge-red    { background:#fee2e2; color:#b91c1c; }
    .badge-blue   { background:#dbeafe; color:#1d4ed8; }
    .badge-purple { background:#f3e8ff; color:#7e22ce; }
    .badge-gray   { background:#f1f5f9; color:#475569; }

    /* ── Card ────────────────────────────────────── */
    .card { background:var(--surface); border:1px solid var(--border); border-radius:1rem; box-shadow:0 1px 3px rgba(0,0,0,.06); transition: box-shadow .2s, transform .2s; }
    .card:hover { box-shadow:0 8px 24px -4px rgba(0,0,0,.12); }

    /* ── Dashed divider ──────────────────────────── */
    .dashed-divider { background:repeating-linear-gradient(90deg,#e2e8f0 0,#e2e8f0 8px,transparent 8px,transparent 16px); height:1px; }

    /* ── Dark-mode theme toggle (floating) ───────── */
    #theme-toggle {
      position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 999;
      width: 3rem; height: 3rem; border-radius: 9999px;
      background: linear-gradient(135deg,#3B82F6,#1D4ED8);
      color: #fff; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
      box-shadow: 0 4px 20px rgba(29,78,216,.4);
      transition: transform .2s, box-shadow .2s;
    }
    #theme-toggle:hover { transform: scale(1.1); box-shadow: 0 6px 28px rgba(29,78,216,.5); }

    /* ── Print ───────────────────────────────────── */
    @media print { nav, footer, .no-print, .print-hide, #theme-toggle { display:none!important; } }
  </style>

  {% block extra_head %}{% endblock %}
</head>
<body class="h-full antialiased">

  {% include 'components/navbar.html' %}
  {% include 'components/messages.html' %}
  <main class="min-h-screen">{% block content %}{% endblock %}</main>
  {% include 'components/footer.html' %}

  <!-- Floating dark mode toggle -->
  <button id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
    <i class="fa-solid fa-moon" id="theme-icon"></i>
  </button>

  <script>
    (function () {
      const html  = document.documentElement;
      const btn   = document.getElementById('theme-toggle');
      const icon  = document.getElementById('theme-icon');

      function applyTheme(dark) {
        html.classList.toggle('dark', dark);
        icon.className = dark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        localStorage.setItem('tms-theme', dark ? 'dark' : 'light');
      }

      // Sync icon with current state (already set by inline script above)
      applyTheme(html.classList.contains('dark'));

      btn.addEventListener('click', () => applyTheme(!html.classList.contains('dark')));
    })();
  </script>

  {% block extra_scripts %}{% endblock %}
</body>
</html>
