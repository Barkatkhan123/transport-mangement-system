{% extends 'base.html' %}
{% block title %}404 — Page Not Found | TMS{% endblock %}
{% block content %}
<div class="min-h-[calc(100vh-64px)] bg-gradient-to-br from-slate-50 to-blue-50/30 flex items-center justify-center px-4 py-12">
  <div class="text-center fade-up max-w-md">
    <div class="relative inline-block mb-8">
      <p class="text-[120px] font-black text-blue-700/10 leading-none select-none">404</p>
      <div class="absolute inset-0 flex items-center justify-center">
        <div class="w-20 h-20 bg-blue-100 rounded-3xl flex items-center justify-center">
          <svg class="w-10 h-10 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
        </div>
      </div>
    </div>
    <h1 class="text-2xl font-extrabold text-slate-800 mb-2">Page Not Found</h1>
    <p class="text-slate-500 mb-8">The page you're looking for doesn't exist or may have been moved.</p>
    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <a href="{% url 'home' %}"
        class="inline-flex items-center justify-center gap-2 bg-blue-700 hover:bg-blue-800 text-white px-6 py-3 rounded-xl font-bold text-sm transition-colors shadow-sm shadow-blue-200">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        Go Home
      </a>
      <a href="javascript:history.back()"
        class="inline-flex items-center justify-center gap-2 bg-white border-2 border-slate-200 text-slate-700 px-6 py-3 rounded-xl font-semibold text-sm hover:bg-slate-50 transition-all">
        Go Back
      </a>
    </div>
  </div>
</div>
{% endblock %}
