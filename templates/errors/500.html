{% extends 'base.html' %}
{% block title %}500 — Server Error | TMS{% endblock %}
{% block content %}
<div class="min-h-[calc(100vh-64px)] bg-gradient-to-br from-slate-50 to-red-50/20 flex items-center justify-center px-4 py-12">
  <div class="text-center fade-up max-w-md">
    <div class="relative inline-block mb-8">
      <p class="text-[120px] font-black text-red-600/10 leading-none select-none">500</p>
      <div class="absolute inset-0 flex items-center justify-center">
        <div class="w-20 h-20 bg-red-100 rounded-3xl flex items-center justify-center">
          <svg class="w-10 h-10 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
          </svg>
        </div>
      </div>
    </div>
    <h1 class="text-2xl font-extrabold text-slate-800 mb-2">Something Went Wrong</h1>
    <p class="text-slate-500 mb-8">Our server encountered an unexpected error. We're working on fixing it. Please try again in a moment.</p>
    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <a href="{% url 'home' %}"
        class="inline-flex items-center justify-center gap-2 bg-blue-700 hover:bg-blue-800 text-white px-6 py-3 rounded-xl font-bold text-sm transition-colors shadow-sm shadow-blue-200">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        Go Home
      </a>
      <button onclick="window.location.reload()"
        class="inline-flex items-center justify-center gap-2 bg-white border-2 border-slate-200 text-slate-700 px-6 py-3 rounded-xl font-semibold text-sm hover:bg-slate-50 transition-all">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        Try Again
      </button>
    </div>
  </div>
</div>
{% endblock %}
