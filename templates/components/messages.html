{% if messages %}
<div id="msg-stack" class="fixed top-20 right-4 z-50 flex flex-col gap-2 w-80 max-w-[calc(100vw-2rem)]">
  {% for message in messages %}
  <div class="slide-in flex items-start gap-3 p-3.5 pr-4 rounded-2xl shadow-lg border backdrop-blur-sm
    {% if message.tags == 'success' %}bg-emerald-50/95 border-emerald-200 text-emerald-800
    {% elif message.tags == 'error' %}bg-red-50/95 border-red-200 text-red-800
    {% elif message.tags == 'warning' %}bg-amber-50/95 border-amber-200 text-amber-800
    {% else %}bg-blue-50/95 border-blue-200 text-blue-800{% endif %}">
    <div class="mt-0.5 shrink-0 w-7 h-7 rounded-full flex items-center justify-center
      {% if message.tags == 'success' %}bg-emerald-100
      {% elif message.tags == 'error' %}bg-red-100
      {% elif message.tags == 'warning' %}bg-amber-100
      {% else %}bg-blue-100{% endif %}">
      <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20">
        {% if message.tags == 'success' %}
          <path fill-rule="evenodd" d="M16.704 4.153a.75.75 0 01.143 1.052l-8 10.5a.75.75 0 01-1.127.075l-4.5-4.5a.75.75 0 011.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 011.05-.143z" clip-rule="evenodd"/>
        {% elif message.tags == 'error' %}
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.28 7.22a.75.75 0 00-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 101.06 1.06L10 11.06l1.72 1.72a.75.75 0 101.06-1.06L11.06 10l1.72-1.72a.75.75 0 00-1.06-1.06L10 8.94 8.28 7.22z" clip-rule="evenodd"/>
        {% else %}
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a.75.75 0 000 1.5h.253a.25.25 0 01.244.304l-.459 2.066A1.75 1.75 0 0010.747 15H11a.75.75 0 000-1.5h-.253a.25.25 0 01-.244-.304l.459-2.066A1.75 1.75 0 009.253 9H9z" clip-rule="evenodd"/>
        {% endif %}
      </svg>
    </div>
    <p class="text-sm font-medium flex-1 leading-snug">{{ message }}</p>
    <button onclick="this.closest('[class*=slide-in]')?.remove()" class="shrink-0 mt-0.5 opacity-50 hover:opacity-100 transition-opacity">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>
  {% endfor %}
</div>
<script>
  setTimeout(() => {
    const s = document.getElementById('msg-stack');
    if (s) { s.style.transition='opacity .6s'; s.style.opacity='0'; setTimeout(()=>s.remove(), 600); }
  }, 4500);
</script>
{% endif %}
